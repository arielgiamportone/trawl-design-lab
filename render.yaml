# Blueprint de Render para la API de vista previa (ver docs/despliegue.md).
# Render → New → Blueprint → este repositorio → Apply.
# Esquema: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: trawl-design-lab-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Despliega cada commit de main cuando pasan los checks de CI (reemplaza a autoDeploy: true).
    autoDeployTrigger: checksPass
    # Sin buildFilter a propósito: con un filtro de rutas, un push de varios commits cuyo último
    # commit no toca src/ (o un arreglo de CI que sólo toca la web) dejaba la API sin redesplegar
    # y desfasada de la app (404 en las rutas nuevas). Ver docs/despliegue.md.
    envVars:
      # Origen del frontend publicado en GitHub Pages (sin ruta ni barra final).
      - key: TRAWLKIT_CORS_ORIGINS
        value: https://arielgiamportone.github.io
      # Guardas de costo para la CPU lenta del plan gratuito.
      - key: TRAWLKIT_MAX_SIM_SECONDS
        value: '20'
      - key: TRAWLKIT_MAX_OPT_GRID
        value: '15'
      - key: TRAWLKIT_MAX_BATCH_SECONDS
        value: '90'
