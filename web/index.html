<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Diseño y dimensionamiento de redes de arrastre con el motor trawlkit."
    />
    <meta name="color-scheme" content="light dark" />
    <title>trawl-design-lab · Diseño de redes de arrastre</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('trawl-design-lab:theme') || 'null');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
