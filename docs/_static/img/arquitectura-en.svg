<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d"><title id="t">trawl-design-lab architecture</title><desc id="d">trawl-design-lab architecture</desc>
<style>
  :root { --ink: #1b2a3a; --muted: #5b6b7b; --line: #9fb3c8; --sea: #e7f0f8; --land: #f6f4ee;
    --accent: #1c5cab; --accent2: #0f8a7e; --warm: #c35a1b; --box: #ffffff; --boxline: #b9c8d8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6edf3; --muted: #9fb0c0; --line: #4b6075; --sea: #11243a; --land: #1d2733;
      --accent: #6aa7ff; --accent2: #3cc7b5; --warm: #f08a4b; --box: #18212b; --boxline: #3a4b5d; }
  }
  text { font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .muted { fill: var(--muted); }
  .accent { fill: var(--accent); }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 1.5; }
  .boxa { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
  .arrow { stroke: var(--muted); stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .net { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .mesh { stroke: var(--accent); stroke-width: 0.8; opacity: 0.55; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
    orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker>
</defs>
<text x="600" y="34" font-size="22" font-weight="800" text-anchor="middle">trawl-design-lab architecture</text><rect x="40" y="70" width="300" height="130" rx="12" class="box"/><text x="190.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Open data</text><text x="190.0" y="118" font-size="13" text-anchor="middle" class="muted">FAO A-3 nets and FAO catalogue</text><text x="190.0" y="136" font-size="13" text-anchor="middle" class="muted">vessels, doors, warps</text><text x="190.0" y="154" font-size="13" text-anchor="middle" class="muted">components (290 items)</text><text x="190.0" y="172" font-size="13" text-anchor="middle" class="muted">per-value provenance</text><rect x="450" y="70" width="300" height="130" rx="12" class="boxa"/><text x="600.0" y="96" font-size="16" font-weight="700" text-anchor="middle">trawlkit engine (Python)</text><text x="600.0" y="118" font-size="13" text-anchor="middle" class="muted">power · netting · drag</text><text x="600.0" y="136" font-size="13" text-anchor="middle" class="muted">rigging · warps · speed</text><text x="600.0" y="154" font-size="13" text-anchor="middle" class="muted">optimisation · simulation</text><text x="600.0" y="172" font-size="13" text-anchor="middle" class="muted">components · cost · batches</text><rect x="860" y="70" width="300" height="130" rx="12" class="box"/><text x="1010.0" y="96" font-size="16" font-weight="700" text-anchor="middle">CI</text><text x="1010.0" y="118" font-size="13" text-anchor="middle" class="muted">pytest · Vitest · e2e</text><text x="1010.0" y="136" font-size="13" text-anchor="middle" class="muted">Excel parity 1e-6 · Pyodide 1e-9</text><path class="arrow" d="M340,135 L448,135"/><path class="arrow" d="M752,135 L858,135"/><rect x="30" y="270" width="204" height="90" rx="12" class="box"/><text x="132.0" y="296" font-size="16" font-weight="700" text-anchor="middle">CLI</text><text x="132.0" y="318" font-size="13" text-anchor="middle" class="muted">trawlkit run · report</text><text x="132.0" y="336" font-size="13" text-anchor="middle" class="muted">optimize · batch</text><path class="arrow" d="M600,200 L132,268"/><rect x="264" y="270" width="204" height="90" rx="12" class="box"/><text x="366.0" y="296" font-size="16" font-weight="700" text-anchor="middle">FastAPI API</text><text x="366.0" y="318" font-size="13" text-anchor="middle" class="muted">Render (Docker)</text><text x="366.0" y="336" font-size="13" text-anchor="middle" class="muted">/design · /batch · …</text><path class="arrow" d="M600,200 L366,268"/><rect x="498" y="270" width="204" height="90" rx="12" class="box"/><text x="600.0" y="296" font-size="16" font-weight="700" text-anchor="middle">Offline engine</text><text x="600.0" y="318" font-size="13" text-anchor="middle" class="muted">Pyodide in a Web Worker</text><text x="600.0" y="336" font-size="13" text-anchor="middle" class="muted">same routes as the API</text><path class="arrow" d="M600,200 L600,268"/><rect x="732" y="270" width="204" height="90" rx="12" class="box"/><text x="834.0" y="296" font-size="16" font-weight="700" text-anchor="middle">Book (Jupyter Book)</text><text x="834.0" y="318" font-size="13" text-anchor="middle" class="muted">35 executable chapters</text><text x="834.0" y="336" font-size="13" text-anchor="middle" class="muted">theory · validation</text><path class="arrow" d="M600,200 L834,268"/><rect x="966" y="270" width="204" height="90" rx="12" class="box"/><text x="1068.0" y="296" font-size="16" font-weight="700" text-anchor="middle">Web app (PWA)</text><text x="1068.0" y="318" font-size="13" text-anchor="middle" class="muted">React · guided and expert</text><text x="1068.0" y="336" font-size="13" text-anchor="middle" class="muted">GitHub Pages</text><path class="arrow" d="M600,200 L1068,268"/><path class="arrow" d="M366,360 L366,384 L1050,384 L1050,363"/><path class="arrow" d="M600,360 L600,374 L1090,374 L1090,363"/><text x="840" y="406" font-size="13" text-anchor="middle" class="muted">the app uses the API or, offline, the engine on the phone</text></svg>
