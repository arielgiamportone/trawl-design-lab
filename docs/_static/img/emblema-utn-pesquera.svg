<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-labelledby="t d"><title id="t">Emblema UTN · Ingeniería Pesquera</title><desc id="d">Emblema propio (no es un logo oficial de la UTN): costa atlántica argentina con las Facultades Regionales Mar del Plata, Chubut y Tierra del Fuego, y una red de arrastre.</desc>
<style>
  :root { --ink: #1b2a3a; --muted: #5b6b7b; --line: #9fb3c8; --sea: #e7f0f8; --land: #f6f4ee;
