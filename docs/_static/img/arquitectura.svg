<text x="600" y="34" font-size="22" font-weight="800" text-anchor="middle">Arquitectura de trawl-design-lab</text><rect x="40" y="70" width="300" height="130" rx="12" class="box"/><text x="190.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Datos abiertos</text><text x="190.0" y="118" font-size="13" text-anchor="middle" class="muted">redes FAO A-3 y catálogo FAO</text><text x="190.0" y="136" font-size="13" text-anchor="middle" class="muted">buques, portones, cables</text><text x="190.0" y="154" font-size="13" text-anchor="middle" class="muted">componentes (290 ítems)</text><text x="190.0" y="172" font-size="13" text-anchor="middle" class="muted">procedencia por valor</text><rect x="450" y="70" width="300" height="130" rx="12" class="boxa"/><text x="600.0" y="96" font-size="16" font-weight="700" text-anchor="middle">Motor trawlkit (Python)</text><text x="600.0" y="118" font-size="13" text-anchor="middle" class="muted">potencia · paños · resistencia</text><text x="600.0" y="136" font-size="13" text-anchor="middle" class="muted">aparejo · cables · velocidad</text><text x="600.0" y="154" font-size="13" text-anchor="middle" class="muted">optimización · simulación</text><text x="600.0" y="172" font-size="13" text-anchor="middle" class="muted">componentes · costo · lotes</text><rect x="860" y="70" width="300" height="130" rx="12" class="box"/><text x="1010.0" y="96" font-size="16" font-weight="700" text-anchor="middle">CI</text><text x="1010.0" y="118" font-size="13" text-anchor="middle" class="muted">pytest · Vitest · e2e</text><text x="1010.0" y="136" font-size="13" text-anchor="middle" class="muted">paridad Excel 1e-6 · Pyodide 1e-9</text><path class="arrow" d="M340,135 L448,135"/><path class="arrow" d="M752,135 L858,135"/><rect x="30" y="270" width="204" height="90" rx="12" class="box"/><text x="132.0" y="296" font-size="16" font-weight="700" text-anchor="middle">CLI</text><text x="132.0" y="318" font-size="13" text-anchor="middle" class="muted">trawlkit run · report</text><text x="132.0" y="336" font-size="13" text-anchor="middle" class="muted">optimize · batch</text><path class="arrow" d="M600,200 L132,268"/><rect x="264" y="270" width="204" height="90" rx="12" class="box"/><text x="366.0" y="296" font-size="16" font-weight="700" text-anchor="middle">API FastAPI</text><text x="366.0" y="318" font-size="13" text-anchor="middle" class="muted">Render (Docker)</text><text x="366.0" y="336" font-size="13" text-anchor="middle" class="muted">/design · /batch · …</text><path class="arrow" d="M600,200 L366,268"/><rect x="498" y="270" width="204" height="90" rx="12" class="box"/><text x="600.0" y="296" font-size="16" font-weight="700" text-anchor="middle">Motor sin conexión</text><text x="600.0" y="318" font-size="13" text-anchor="middle" class="muted">Pyodide en un Web Worker</text><text x="600.0" y="336" font-size="13" text-anchor="middle" class="muted">mismas rutas que la API</text><path class="arrow" d="M600,200 L600,268"/><rect x="732" y="270" width="204" height="90" rx="12" class="box"/><text x="834.0" y="296" font-size="16" font-weight="700" text-anchor="middle">Libro (Jupyter Book)</text><text x="834.0" y="318" font-size="13" text-anchor="middle" class="muted">35 capítulos ejecutables</text><text x="834.0" y="336" font-size="13" text-anchor="middle" class="muted">teoría · validación</text><path class="arrow" d="M600,200 L834,268"/><rect x="966" y="270" width="204" height="90" rx="12" class="box"/><text x="1068.0" y="296" font-size="16" font-weight="700" text-anchor="middle">App web (PWA)</text><text x="1068.0" y="318" font-size="13" text-anchor="middle" class="muted">React · modo guiado y experto</text><text x="1068.0" y="336" font-size="13" text-anchor="middle" class="muted">GitHub Pages</text><path class="arrow" d="M600,200 L1068,268"/><path class="arrow" d="M366,360 L366,384 L1050,384 L1050,363"/><path class="arrow" d="M600,360 L600,374 L1090,374 L1090,363"/><text x="840" y="406" font-size="13" text-anchor="middle" class="muted">la app usa la API o, sin red, el motor del teléfono</text></svg>
