<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-labelledby="t d"><title id="t">Del puerto a la red: flota, proyección y armado</title><desc id="d">Del puerto a la red: flota, proyección y armado</desc>
<style>
  :root { --ink: #1b2a3a; --muted: #5b6b7b; --line: #9fb3c8; --sea: #e7f0f8; --land: #f6f4ee;
    --accent: #1c5cab; --accent2: #0f8a7e; --warm: #c35a1b; --box: #ffffff; --boxline: #b9c8d8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e6edf3; --muted: #9fb0c0; --line: #4b6075; --sea: #11243a; --land: #1d2733;
      --accent: #6aa7ff; --accent2: #3cc7b5; --warm: #f08a4b; --box: #18212b; --boxline: #3a4b5d; }
  }
  text { font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif; fill: var(--ink); }
  .muted { fill: var(--muted); }
  .accent { fill: var(--accent); }
  .box { fill: var(--box); stroke: var(--boxline); stroke-width: 1.5; }
  .boxa { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
  .arrow { stroke: var(--muted); stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .net { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
  .mesh { stroke: var(--accent); stroke-width: 0.8; opacity: 0.55; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
    orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/></marker>
</defs>
<text x="600" y="34" font-size="22" font-weight="800" text-anchor="middle">Del puerto a la red: flota, proyección y armado</text><rect x="30" y="64" width="200" height="104" rx="12" class="box"/><text x="130.0" y="90" font-size="16" font-weight="700" text-anchor="middle">Planilla</text><text x="130.0" y="112" font-size="13" text-anchor="middle" class="muted">flota del puerto</text><text x="130.0" y="130" font-size="13" text-anchor="middle" class="muted">CSV o Excel</text><rect x="270" y="64" width="200" height="104" rx="12" class="boxa"/><text x="370.0" y="90" font-size="16" font-weight="700" text-anchor="middle">Semejanza</text><text x="370.0" y="112" font-size="13" text-anchor="middle" class="muted">s₀ = √(P / P_diseño)</text><text x="370.0" y="130" font-size="13" text-anchor="middle" class="muted">portón ∝ potencia</text><path class="arrow" d="M232,116 L268,116"/><rect x="510" y="64" width="200" height="104" rx="12" class="boxa"/><text x="610.0" y="90" font-size="16" font-weight="700" text-anchor="middle">Refinado</text><text x="610.0" y="112" font-size="13" text-anchor="middle" class="muted">mayor red que cumple</text><text x="610.0" y="130" font-size="13" text-anchor="middle" class="muted">tiro · apertura · cable</text><path class="arrow" d="M472,116 L508,116"/><rect x="750" y="64" width="200" height="104" rx="12" class="box"/><text x="850.0" y="90" font-size="16" font-weight="700" text-anchor="middle">Armado</text><text x="850.0" y="112" font-size="13" text-anchor="middle" class="muted">portón, cable, boyas</text><text x="850.0" y="130" font-size="13" text-anchor="middle" class="muted">e hilo del catálogo</text><path class="arrow" d="M712,116 L748,116"/><rect x="990" y="64" width="200" height="104" rx="12" class="box"/><text x="1090.0" y="90" font-size="16" font-weight="700" text-anchor="middle">Resultado</text><text x="1090.0" y="112" font-size="13" text-anchor="middle" class="muted">red escalada · costo</text><text x="1090.0" y="130" font-size="13" text-anchor="middle" class="muted">XLSX · PDF por buque</text><path class="arrow" d="M952,116 L988,116"/></svg>
