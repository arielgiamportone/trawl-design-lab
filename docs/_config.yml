title: trawl-design-lab
author: Ariel Luján Giamportone
copyright: "2026"
language: es
only_build_toc_files: true
exclude_patterns: [_build, "**.ipynb_checkpoints", README.md, CITAS.md, _template_capitulo.md]

execute:
  execute_notebooks: cache
  timeout: 180
  allow_errors: false

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - deflist
    - substitution
    - linkify

bibtex_bibfiles:
  - referencias.bib

sphinx:
  config:
    bibtex_reference_style: author_year
    bibtex_default_style: plain
    language: es
    numfig: true
    math_number_all: false
    suppress_warnings: ["mystnb.unknown_mime_type"]
    nb_code_prompt_show: "Mostrar código"
    nb_code_prompt_hide: "Ocultar código"

repository:
  url: https://github.com/arielgiamportone/trawl-design-lab
  path_to_book: docs
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  home_page_in_navbar: true
