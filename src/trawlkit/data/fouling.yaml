# Escenarios de ensuciamiento y colmatación de la red (trawlkit.sim.scenario).
#
# Nivel por zona de 0 (limpio) a 1 (muy ensuciado). Zonas: wings (puntas de ala y alas), body
# (square, vientre y cuerpos) y codend (extensión y copo). El nivel f modifica cada hilo:
#   diámetro efectivo d·(1 + diameter_gain·f), C_N·(1 + cn_gain·f), peso sumergido
#   w·(1 + weight_gain·f).
# A VERIFICAR: coeficientes estimados a partir de la literatura de redes de acuicultura (Swift et
# al. 2006, la solidez de una red ensuciada puede duplicarse y su arrastre crecer 2–3 veces; Bi et
# al. 2018, con hidroides el arrastre crece mucho más). En arrastre, algas o medusas tapan zonas
# puntuales del paño durante el lance; no hay mediciones publicadas para artes de arrastre.
source: estimación a partir de Swift et al. 2006 y Bi et al. 2018 (A VERIFICAR)
coefficients:
  diameter_gain: 1.5
  cn_gain: 0.3
  weight_gain: 2.0
items:
  - id: clean
    name: Red limpia
    zones: {wings: 0.0, body: 0.0, codend: 0.0}
    notes: Sin ensuciamiento (valor por defecto).
  - id: algae_wings
    name: Algas en las alas
    zones: {wings: 0.6, body: 0.2, codend: 0.0}
    notes: Algas desprendidas que se enganchan en las alas y la boca al arrastrar cerca de bosques de macroalgas.
  - id: jellyfish_codend
    name: Medusas en el copo
    zones: {wings: 0.0, body: 0.3, codend: 1.0}
    notes: Colmatación del copo y el cuerpo por medusas (floraciones estacionales).
  - id: general
    name: Ensuciamiento general
    zones: {wings: 0.5, body: 0.5, codend: 0.5}
    notes: Red con mantenimiento deficiente o con organismos adheridos en todo el paño.
