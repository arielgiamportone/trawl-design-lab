# Buques argentinos con características publicadas (Fase 19.4). Cada valor cita su fuente; lo
# derivado lleva la fórmula en la nota. Lo que la fuente no publica queda vacío («A VERIFICAR»):
# ningún buque argentino tiene diámetro de hélice, RPM de hélice ni tiro a punto fijo publicados.
# Los de fuente secundaria (enciclopedia, prensa) van como «draft» (provisorios).
# Potencias en kW → hp con 1 hp métrico = 0,7355 kW (trawlkit.units.HP_TO_KW). Consultas 2026-10-27.
source: INIDEP (argentina.gob.ar), Giorgini y Buratti (2023), prensa especializada
