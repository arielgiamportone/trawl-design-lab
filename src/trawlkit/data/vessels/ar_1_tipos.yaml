# Tipos de buque de la flota argentina (Fase 19.4): presets TÍPICOS armados con los valores medios
# publicados de cada estrato. No son buques reales: cada valor cita su tabla y página; lo derivado
# lleva la fórmula en la nota y lo que la fuente no da queda marcado «A VERIFICAR» (el caso de
# diseño lo completa escalando el buque de la A-3 y lo anota). Fuentes consultadas el 2026-10-27.
# Las fuentes no publican manga, puntal, calado ni tipo de hélice por estrato: la hélice queda en
# el valor por defecto del esquema (paso fijo) como supuesto.
source: INIDEP, El Mar Argentino y sus Recursos Pesqueros 3 (2001); FAO (2005); CFP Res. 7/2018
notes:
- 'Clasificación oficial (FAO 2005, p. 9 del PDF): costera (rada/ría y costera) y de altura (arrastreros fresqueros y congeladores, tangoneros, surimeros, vieira; palangreros; poteros).'
- 'HP = potencia del motor principal del registro; el motor la usa como BHP (supuesto).'
- 'TRB = tonelaje de registro bruto; se guarda en gross_tonnage.'
