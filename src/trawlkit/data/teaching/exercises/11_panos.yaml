# Ejercicios del capítulo 11 «Paños de red y cortes» (semilla 0: paños de la FAO A-3).
exercises:
  - id: panos.hilo_y_borde
    chapter: 11_panos_y_cortes
    topic: panos
    level: basico
    title: Rendimiento del hilo y borde estirado
    statement: >
      Un paño se teje con hilo de {rtex} Rtex (gramos por cada 1000 m de hilo). Calcule (a) el
      rendimiento del hilo en metros por kilogramo y (b) el largo estirado de un borde de {mallas}
      mallas de {malla} mm.
    vars:
      rtex: {label: Título del hilo, unit: Rtex, choices: [640, 950, 1280, 1550, 2100], default: 1280}
      mallas: {label: Mallas del borde, unit: mallas, choices: [57, 113, 117, 243, 372, 412], default: 117}
      malla: {label: Tamaño de malla estirada, unit: mm, choices: [40, 60, 80, 100, 120], default: 80}
    solver: hilo_y_borde
    answers:
      - {key: runnage, label: Rendimiento, unit: m/kg, decimals: 1}
      - {key: borde_m, label: Borde estirado, unit: m, decimals: 2}
    hints:
      - "Rtex = g/1000 m, así que 1 kg de hilo tiene 10⁶/Rtex metros."
    explanation: >
      Rendimiento = 1 000 000/{rtex} = {runnage} m/kg. Borde = {mallas}·{malla}/1000 = {borde_m} m.
    refs: [prado1990]

  - id: panos.corte_simetrico
    chapter: 11_panos_y_cortes
    topic: panos
    level: intermedio
    title: Corte de un paño simétrico
    statement: >
      Un paño de cuerpo pasa de {t1} mallas en la boca a {t2} mallas en la cola en {n} mallas de
      alto, cortado igual en los dos costados. Calcule las mallas que se pierden en cada costado, la
      razón de corte (mallas de ancho por malla de alto) y el código de corte FAO.
    vars:
      t1: {label: Mallas del borde mayor (T1), unit: mallas, choices: [200, 240, 300, 372], default: 372}
      h: {label: Mallas cortadas por costado, choices: [30, 40, 60, 75], default: 105, show: false}
      codigo: {label: Corte, choices: [1N2B, 1N1B, AB, 3N2B, 2N1B], default: 1N2B, show: false}
    solver: corte_simetrico
    answers:
      - {key: lado, label: Mallas cortadas por costado, unit: mallas, decimals: 0, tol_rel: 0}
      - {key: razon, label: Razón de corte, decimals: 3, tol_abs: 0.005, tol_rel: 0}
      - {key: codigo_corte, label: Código de corte, kind: code}
    hints:
      - Cada costado pierde la mitad de la diferencia T1 − T2.
      - "1N2B (una punta, dos malletas) avanza media malla de ancho por malla de alto: razón 1/2."
    explanation: >
      Por costado se cortan ({t1} − {t2})/2 = {lado} mallas en {n} de alto: razón {lado}/{n} =
      {razon}, que en la tabla de cortes es {codigo_corte}.
    refs: [prado1990]

  - id: panos.angulo_corte
    chapter: 11_panos_y_cortes
    topic: panos
    level: intermedio
    title: Ángulo de ataque de un corte
    statement: >
      Un ala cortada {codigo} trabaja con un coeficiente de abertura horizontal U1 = {u1}. Con las
      mallas de aumento a (en ancho) y d (en alto) de la tabla de cortes, calcule U2 = √(1 − U1²) y
      el ángulo de ataque del corte θ = atan(a·U1/(d·U2)).
    vars:
      codigo: {label: Corte, choices: [1N2B, 1N1B, 3N2B, 2N1B, AB], default: 1N2B}
      u1: {label: U1, choices: [0.30, 0.38, 0.45, 0.50, 0.60], default: 0.38, decimals: 2}
    solver: angulo_corte
    answers:
      - {key: u2, label: U2, decimals: 3, tol_abs: 0.002, tol_rel: 0}
      - {key: theta, label: Ángulo de ataque θ, unit: °, decimals: 1, tol_abs: 0.3, tol_rel: 0}
    hints:
      - "Busque {codigo} en la tabla de cortes: las columnas de aumento dan a y d."
    explanation: >
      Para {codigo}, a = {a} y d = {d}. U2 = √(1 − {u1}²) = {u2}; θ = atan({a}·{u1}/({d}·{u2})) =
      {theta}°.
    formats: {a: 0, d: 0}
    refs: [prado1990]

  - id: panos.mallas_y_area
    chapter: 11_panos_y_cortes
    topic: panos
    level: basico
    title: Mallas y superficie de trabajo de un paño
    statement: >
      Un paño tiene T1 = {t1} y T2 = {t2} mallas en sus bordes, N = {n} mallas de alto, malla de
      {malla} mm y trabaja con U1 = {u1}. Calcule el número de mallas, ((T1 + T2 − 1)·(N − 0,5)) +
      0,5, y la superficie de trabajo U1·U2·((T1 + T2)/2)·N·(m_L/1000)².
    vars:
      t1: {label: T1, unit: mallas, choices: [372, 243, 412, 117], default: 372}
      t2: {label: T2, unit: mallas, choices: [162, 113, 372, 57], default: 162}
      n: {label: N, unit: mallas, choices: [210, 130, 40, 120], default: 210}
      malla: {label: Malla, unit: mm, choices: [60, 40, 80], default: 60}
      u1: {label: U1, choices: [0.38, 0.23, 0.5], default: 0.38, decimals: 2}
    solver: mallas_y_area
    answers:
      - {key: mallas_total, label: Número de mallas, decimals: 0, tol_rel: 0.001}
      - {key: area_m2, label: Superficie de trabajo, unit: m², decimals: 2}
    explanation: >
      Mallas = (({t1} + {t2} − 1)·({n} − 0,5)) + 0,5 = {mallas_total}. U2 = {u2}; superficie =
      {u1}·{u2}·(({t1} + {t2})/2)·{n}·({malla}/1000)² = {area_m2} m².
    formats: {u2: 3}
    refs: [prado1990]
