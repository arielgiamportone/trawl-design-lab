notes:
- 'BORRADOR: el costado pasa de 30 mallas de 300 mm (9,00 m) a 30 de 200 mm (6,00 m) y luego a 45 de 200
  mm (9,00 m), como se lee la fig. 3: el empalme S1/S2 no cierra (33 %). Los cortes no están rotulados.'
- 'Aparejo de la simulación (p. 2): bridas de 45 m (superior Ø18 mm, inferior Ø22 mm), portones Mercury
  de 2300 kg, 600 m de cable de 24 mm, lima de acero de 14 mm, burlón combinado de 18 mm con doble forro,
  4 nudos, 130 m, arena. El informe no da el largo de las malletas (el motor usa sus 25 m), la superficie
  del portón ni el buque.'
- 'Lima: 2 × (11,10 + 9,70) + 6 = 47,6 m en el plano frente a «LIMA 46,4 MTS» del título y del escaneo;
  se usa 46,4 m. Burlón: 2 × (11,10 + 13,75) + 6 = 55,7 m («BURLÓN 55,7 MTS»).'
- Hilos y flotación del escaneo manuscrito de la empresa (fig. 1), A VERIFICAR.
