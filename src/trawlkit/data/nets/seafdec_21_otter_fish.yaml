  description: 13,60 PE Ø17 mm en cada ala + bocana 2,00
  construction: rope_pe_18mm
footrope:
  name: burlón
  length_m: 33.6
  diameter_mm: 25
  wing_m: 16.3
  bosom_m: 1.0
  description: 16,30 PE Ø25 mm en cada ala + bocana 1,00
  construction: rope_pe_24mm
design:
  vessel_length_m: 24.0
notes:
- 'BORRADOR: el plano une 4/5 el cuerpo de 200 mallas de 38 mm al copo de 250 mallas de 19 mm (7,60 m
  contra 4,75 m de largo estirado, 38 %); el resto de las uniones da su razón y cierra (3/4, 4/5, 4/5
  y 2/3, hasta 17 %).'
- Lima = 2 × 13,60 + 2,00 = 29,20 m y burlón = 2 × 16,30 + 1,00 = 33,60 m, como el total del plano.
- Los cabos del plano son PE de Ø17 y Ø25 mm; el motor toma del catálogo de componentes los PE de 18 y
  24 mm (los más cercanos) para el peso y la resistencia.
- 'El plano no da boyas, lastre ni portones: el caso usa el portón de la A-3 escalado por potencia.'
