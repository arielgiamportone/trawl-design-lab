notes:
- El cuerpo cierra en 75 mallas de 80 mm (6,00 m) sobre el copo de 100 mallas de 60 mm (6,00 m) en cada
  cara; el costado termina en una malla. Es la corrección del «exceso de material» de la red original
  (fig. 2).
- 'Las relingas del plano suman las bridas de 4 m: la lima publicada (39,4 m) es 2 × (4 + 3,7 + 7 + 2)
  + 6 m y el burlón (45,0 m) 2 × (4 + 3,7 + 3,3 + 7 + 2) + 5 m. El motor toma esos totales (como ITO 043
  e IAT 75); los tramos verticales (bridas de 4 m y tramos de 3,7 m en la lima y de 3,7 + 3,3 m en el
  burlón) no van sobre el paño y los tramos sobre el ala son más largos que su borde estirado (53 filas
  AB de 120 mm = 6,36 m): A VERIFICAR.'
- 'Aparejo y condiciones de la simulación (p. 2): 5 flotadores de 200 mm; 140 kg de cadena; bridas de
  cable combinado de 4 m por banda (superior Ø18 mm, inferior Ø22 mm); portones planos de hierro y madera
  de 4,20 × 1,30 m y 450 kg; tijera de 55 m de Ø26 mm; 350 m de cable de Ø22 mm; relinga superior Ø18
  mm e inferior Ø22 mm de cable combinado; 4 nudos; 100 m; fango.'
- 'Hilos: el informe no los da (la fig. 3 no rotula el copo); se suponen los de la fig. 2 (A VERIFICAR).'
