notes:
- 'BORRADOR: al cambiar de mallero el plano conserva la cantidad de mallas (194 de 200 mm sobre 194 de
  160 mm, 160 de 160 mm sobre 160 de 120 mm, 169 de 200 mm sobre 169 de 160 mm, 144 de 160 mm sobre 144
  de 120 mm): empalmes malla a malla que no cierran por largo estirado (20–25 %). El plano no da el hilo
  (supuesto nylon de Ø3 mm) ni el copo (supuesto de 103 mm, 22 m), y la pieza 718 M del ala inferior no
  se modela.'
- 'Burlón: el plano da 41,50 m; EH 06/12, IC 004/24 e IC 041/25 dicen 50 m; IC 019/13, 35,3/40,0 m; Inf.
  Téc. 66, 40,3 m. Se usa el del plano (A VERIFICAR).'
- 'Mediciones: IC 016/24 (Angelescu, SPF 08,5 de 4,8 m², lances 17–28 a 21–117 m con AH de los sensores
  de ala), Inf. Téc. 66 (Oca Balda, polivalentes de 1260 kg, sonar de red) e IC 041/25 (media de la campaña).
  EH 06/12: DP entre 100 y 115 m y AV de unos 4,5 m a 4 nudos, sin profundidad por lance.'
