name: Red Engel de 35,5 m de las campañas de merluza del INIDEP (IAT 101/2017, fig. 1)
description: 'Red de arrastre de fondo de dos caras usada en las campañas de evaluación de merluza del
  INIDEP desde 1993 (BIP Holmberg, Oca Balda y Angelescu): alas y cuerpo delantero de 200 mm, 160, 120
  y 110 mm hacia atrás; lima de 35,5 m (Roth y García 2017, fig. 1). El plano no da el hilo ni el copo
  (supuestos) y empalma malla a malla al cambiar de mallero.'
