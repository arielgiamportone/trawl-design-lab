notes:
- 'BORRADOR: El vientre termina en «26» mallas de 80 mm (2,08 m) según el plano, sobre el copo de 70 mallas
  de 60 mm (4,20 m); el corte 1N4B del paño daría 46 mallas (3,68 m). Se transcribe como se lee: A VERIFICAR.
  El dorso cierra (26 × 160 mm = 4,16 m frente a 4,20 m). Los costados terminan en 13 mallas de 140 mm
  sin cabo de cierre: el plano no dice cómo se unen al copo.'
- 'Flotación: se modela la variante con los dos flotadores de 200 mm que recomienda el informe (DynamiT:
  AV de 1,1–1,3 m y AH de 12,8–13,9 m, tabla 1, p. 5); sin ellos la AV de DynamiT queda en 0,9 m a todas
  las velocidades. Sin flotación publicada el motor tomaría la del libro (52 boyas), que no corresponde
  a esta red.'
- 'Relingas: 2 × (3,25 + 6,15 + 3,25) + 9,54 = 34,84 m y 2 × (3,25 + 2,75 + 5,45 + 3,25) + 7,5 = 36,9
  m; los tramos verticales de 3,25 m (y 2,75 m en el burlón) van por delante de la punta del ala.'
- 'Aparejo de las simulaciones (p. 2): tijera de 70 m de cable de acero de 22 mm, cable de arrastre de
  acero de 24 mm con alma de acero, portones rectangulares planos de madera con refuerzos de acero de
  4,08 m² y 530 kg; 4; 3,5; 3; 2,8 y 2,5 nudos. El informe no da las cañas, la profundidad ni el fondo.'
