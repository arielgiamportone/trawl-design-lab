notes:
- 'Unión al copo: el copo de dos caras (2 × 100 mallas de 60 mm = 12,0 m) se une al dorso (40 × 120 mm
  = 4,80 m) y al vientre (61 × 120 mm = 7,32 m) alrededor de la boca: 12,12 m frente a 12,0 m (1–2 %).
  Los costados terminan antes del copo, fruncidos en un cabo de 0,50 m que cierra en las costuras (aft_rope_m),
  y no suman ancho al copo. Cara por cara la unión no es 1:1 y el plano no dice cómo se reparte la diferencia
  (el validador lo informa como aviso codend_join). Tres rótulos de corte (U1, U2, L3) no dan el cambio
  de ancho de su paño: se transcriben como se leen (el validador lo avisa).'
- 'Cabos del plano: A combinado 22 mm 11,00 m; B combinado 22 mm 3,75 m; E combinado 22 mm 6,00 m (lima:
  2 × (11,00 + 3,75) + 6,00 = 35,5 m); O cable mixto 24 mm 10,00 m; P 3,75 m; S 5,00 m (burlón: 2 × (10,00
  + 3,75) + 5,00 = 32,5 m); J cable mixto 24 mm 3,15 m (borde delantero del costado); costuras de 2 y
  3 mm.'
- 'Aparejo de las tres simulaciones (pp. 1 y 5): tijera de 70 m de cable de acero de 22 mm, cable de arrastre
  de acero de 24 mm con alma de acero, portones rectangulares planos de madera con refuerzos de acero
  de 540 kg cada uno, 3,5 nudos; tangones del B/P «Atlántico 1».'
- 'Paños del plano: #1 28,80 m² y 62,26 kg; LOW 25,95 m² y 57,76 kg; SIDE 9,92 m² y 17,18 kg; total 64,68
  m² y 137,21 kg.'
- El cabo del burlón es un cable mixto de 24 mm; el motor toma el combinado de 24 mm del catálogo de componentes
  para el peso y la resistencia.
