validation_doors:
  polivalente_1200:
    label: polivalente, 5,58 m², 1200 kg (EH 06/12), polar Morgère Polyvalent Ovale
    door_area_m2: 5.58
    door_length_m: 3.2
    door_height_m: 2.18
    door_weight_air_kg: 1200.0
    door_polar_id: sfia1993_morgere_polyvalent_ovale
    door_type: polyvalent
    note: '«portones polivalentes de 1200 kg y 5,58 m2 de superficie» (EH 06/12, p. 6; las demás fuentes
      dan sólo «polivalentes de 1200 kg»). Polar: el INIDEP no publica la polar de sus portones polivalentes:
      hoja «Morgère Polyvalent Ovale» de Seafish/IFREMER/DIFTA (1993), el mismo tipo. A VERIFICAR. Largo
      y alto: L·H·0,80 = 5,58 m² con H/L = 0,68 (proporciones de la hoja de Seafish), supuesto'
  spf08_1000:
    label: Morgère SPF08, 4,68 m², 1000 kg (IC 029/18, IC 012/21)
    door_area_m2: 4.68
    door_length_m: 3.06
    door_height_m: 1.53
    door_weight_air_kg: 1000.0
    door_cl: 1.0
    door_cd: 0.58
    note: '«modelo SPF08, con un peso individual de 1000 kg y un área total de 4.68 m2» (IC 029/2018,
      p. 4; IC 012/2021, p. 3). CL y CD: los del SPF08 de IAT 101/2017 (supuesto, A VERIFICAR). Largo
      y alto: la fuente da la superficie pero no las medidas: proporción alto/largo 0,5 del portón plano
      genérico (como ITO 043/2022). A VERIFICAR'
  spf085_iat026:
    label: Morgère SPF 08,5, 4,9 m², 1200 kg, CL 0,92 / CD 0,40 (IAT 026/25)
    door_area_m2: 4.9
    door_length_m: 3.13
    door_height_m: 1.57
    door_weight_air_kg: 1200.0
    door_cl: 0.92
    door_cd: 0.4
    note: '«portones hidrodinámicos Morgère SPF 08,5 de 1200 kg de peso y 4,9 m2 de área» y «CD = 0,4
      y CL = 0,92» (IAT 026/25, pp. 2–3; IC 016/24 da 4,8 m²). Largo y alto: la fuente da la superficie
      pero no las medidas: proporción alto/largo 0,5 del portón plano genérico (como ITO 043/2022). A
      VERIFICAR'
simulated:
- speed_kn: 4.0
  depth_m: 400.0
  warp_m: 1200.0
  sweeps_m: 100.0
  door: spf085_iat026
  door_spread_m: 162.3
  horizontal_opening_m: 28.4
  vertical_opening_m: 2.4
  drag_kgf: 9175.828
  source: roth2025iat026
  note: 'DynamiT del INIDEP, tabla 1 (p. 8), portones de 1200 kg: «1200 2,4 28,4 162,3 9175,828 105»;
    4 nudos, 400 m y 1200 m de cable (p. 6). Las patentes de 100 m son las de la red (IAT 151/2018), el
    informe no las repite (supuesto)'
notes:
- 'Red construida (fig. 1): cambian respecto de la diseñada las puntas de ala (12 y 9 mallas), el costado
  (dos cuñas de 6 mallas), el vientre (alas de 55,5 + 10 filas, Ø4 mm) y el copo (hilo doble de 4 mm).
  La columna de malleros del vientre no está impresa: se suponen los del dorso (A VERIFICAR).'
- 'Mediciones: 52 lances de la tabla 1 de IAT 151/2018 (polivalentes de 1200 kg, 26–93 m), 3 de IC 029/2018
  y 40 de IC 012/2021 (SPF08 de 1000 kg y 4,68 m², 63–161 m). La superficie y la polar de los polivalentes
  no se publican: 5,58 m² (EH 06/12) y la hoja Morgère Polyvalent Ovale de Seafish, A VERIFICAR.'
- 'Relingas: el plano no da material ni diámetro; el motor usa los cabos del libro.'
