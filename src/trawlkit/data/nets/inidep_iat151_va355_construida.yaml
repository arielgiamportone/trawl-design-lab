name: Red de fondo VA-35,5/45 del INIDEP, construida (IAT 151/2018, fig. 1)
description: 'La red VA-35,5/45 tal como se construyó y se midió a bordo del BIP Víctor Angelescu en 2018:
  alas de 300 mm, dorso y costados en PE de 3 mm, vientre en PE de 4 mm y copo de 110 mm en hilo doble
  de 4 mm; 90 boyas de 200 mm y 380 kg de cadena (Bartozzetti 2018). Lleva 95 lances medidos con tres
  juegos de portones y una simulación DynamiT a 400 m.'
