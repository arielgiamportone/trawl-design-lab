notes:
- 'Figura del apéndice 3 escaneada a 107 ppp (990 px de ancho): números legibles con ampliación.'
- 'Empalmes con cambio de mallero: 135 × 120 = 202 × 80 (16,2 m); 152 × 80 ≈ 203 × 60 (12,2 m); 133 ×
  60 ≈ 200 × 40 (8,0 m).'
- 'Las alas del dorso tienen 80 filas de 120 mm (9,6 m) y las del vientre 157 filas de 80 mm (12,6 m):
  el cielo de 45 filas completa el largo del dorso.'
