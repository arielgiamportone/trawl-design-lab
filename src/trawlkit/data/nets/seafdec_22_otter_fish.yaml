headrope:
  name: lima
  length_m: 46.1
  diameter_mm: 20
  wing_m: 19.8
  bosom_m: 6.5
  description: 19,80 combinado Ø20 mm en cada ala + bocana 6,50
  construction: rope_combinado_6_20mm
footrope:
  name: burlón
  length_m: 49.8
  diameter_mm: 32
  wing_m: 23.4
  bosom_m: 3.0
  description: 23,40 combinado Ø32 mm en cada ala + bocana 3,00
  construction: rope_combinado_6_24mm
design:
  vessel_length_m: 20.0
notes:
- 'BORRADOR: dos uniones no cierran en largo estirado: 1/1 entre el paño de 80 mm y el de 60 mm (250 mallas,
  25 %) y 2/3 entre el cuerpo de 38 mm y el copo de 19 mm (7,60 m contra 5,70 m, 25 %).'
- Lima = 2 × 19,80 + 6,50 = 46,10 m y burlón = 2 × 23,40 + 3,00 = 49,80 m, como el total del plano.
- El burlón es un combinado de Ø32 mm; el catálogo de componentes llega a 24 mm y el motor toma ese para
  el peso y la resistencia.
- 'El plano no da boyas, lastre ni portones: el caso usa el portón de la A-3 escalado por potencia.'
