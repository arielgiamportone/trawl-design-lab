  hp (Kanhom, Surat Thani, Tailandia, 1986): alas, cielo y primer cuerpo de 51 mm, cuerpo de 45 y 38 mm
  y copo de 25 mm, PE; lima de 26,90 m y burlón de 28,20 m. El plano 36 (11 m, 150 hp) es el mismo.'
