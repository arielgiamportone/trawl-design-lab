design:
  vessel_length_m: 15.0
notes:
- 'BORRADOR: el plano une 1/1 el cuerpo de 125 mallas de 38 mm al copo de 125 mallas de 25 mm (34 % de
  diferencia de largo estirado) y los paños de 51, 45 y 38 mm también 1/1 (12 y 16 %).'
- Lima = 2 × 12,75 + 1,40 = 26,90 m y burlón = 2 × 13,75 + 0,70 = 28,20 m, como el total del plano.
- 'El plano no da boyas, lastre, portones ni tangones: el caso usa la eslora del documento y los valores
  por defecto del motor (portón de la A-3 escalado por potencia, tangones de 24 pies a 20° de Knake et
  al. 1958 y tijera de 70 m del INIDEP), que no son los de la flota tailandesa.'
