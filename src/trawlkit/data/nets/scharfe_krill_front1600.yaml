  front_weight_kg: 230.0
  note: '≈ 2,1 kn, 250 m de cable, pesos de 230 kg: 26 m de alto y 30 m de ancho (≈ 780 m²)'
notes:
- Los costados del plano tienen alas como el dorso y el vientre; en el modelo los costados empiezan en
  la primera estación del cuerpo (las relingas van por las alas del dorso y del vientre).
- 'Circunferencia: 2 × 66 (dorso y vientre) + 2 × 60 (costados) = 252 mallas de 1600 mm, como el título
  del apéndice; 46 × 1600 = 92 × 800 empalma con el frente de 800 mm.'
- 'BORRADOR: el alto del ala del vientre no se lee y el Rtex del ala es dudoso.'
