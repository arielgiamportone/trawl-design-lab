notes:
- Lima = 2 × 8,80 + 2,00 = 19,60 m y burlón = 2 × 10,80 + 0,50 = 22,10 m, como el total del plano.
- 'Uniones con su razón en el plano: 4/5 (280 × 40 mm con 350 × 30 mm, 6 %), 5/6 (250 × 30 mm con 300
  × 25 mm) y 1/1 (200 × 25 mm con 200 × 20 mm, 20 %).'
- 'El plano no da la vara, los patines, las cadenas ni el lastre: el caso usa los valores por defecto
  del motor para la vara (Eigaard et al. 2016 y C056/20).'
