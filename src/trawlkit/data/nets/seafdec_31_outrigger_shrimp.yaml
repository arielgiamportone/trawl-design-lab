notes:
- 'Los rótulos de las alas (10,00 m de lima y 11,20 m de burlón, sin «2 ×») más los de la bocana (2,00
  y 1,20 m) no suman los totales del plano (21,00 y 22,40 m): se toman los totales y la bocana, y el ala
  se deriva.'
- 'Uniones del cuerpo con su razón en el plano: 8/9 (320 × 38 mm con 360 × 32 mm, 5 %), 8/9 (240 × 32
  mm con 270 × 25 mm, 12 %) y 4/5 (120 × 25 mm con 150 × 20 mm).'
- 'El plano no da boyas, lastre, portones ni tangones: el caso usa la eslora del documento y los valores
  por defecto del motor (portón de la A-3 escalado por potencia, tangones de 24 pies a 20° de Knake et
  al. 1958 y tijera de 70 m del INIDEP), que no son los de la flota tailandesa.'
