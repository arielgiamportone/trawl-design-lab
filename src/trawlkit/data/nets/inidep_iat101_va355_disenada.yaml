id: inidep_iat101_va355_disenada
name: Red de fondo VA-35,5/45 del INIDEP, diseñada (IAT 101/2017, fig. 2)
description: 'Red de arrastre de fondo de cuatro caras diseñada por el INIDEP para las campañas de merluza
  del BIP Víctor Angelescu: alas y cielo de 300 mm, cuerpo de 200 a 120 mm en PE de 3 mm y copo de 110
  mm en PE de 5 mm; lima de 35,5 m y burlón de 45,0 m (Roth y García 2017). DynamiT: DP 89,2 m, AH 23,0
  m y AV 3,7 m a 4 nudos, 100 m y 500 m de cable.'
