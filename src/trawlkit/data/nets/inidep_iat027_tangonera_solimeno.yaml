notes:
- 'BORRADOR: el cuerpo termina en 140 mallas de 80 mm (11,20 m) por cara y el copo tiene 100 mallas de
  60 mm (6,00 m): el empalme no cierra (46 %). El costado termina en una malla, sin cabo de cierre, así
  que tampoco cierra por la circunferencia (22,4 m frente a 12,0 m). Es el «exceso de material en la parte
  final del cuerpo» que el INIDEP corrige en la red modificada (fig. 3), no un error de lectura.'
- El plano corrige la relinga superior del plano original de la empresa (39,40 m, que no es la suma de
  sus tramos) a 37,8 m y la bocana del vientre (66 mallas en lugar de 100); el INIDEP recomienda además
  5 m en lugar de 6 m en el centro del burlón (pp. 1 y 5).
- 'Las relingas del plano suman las bridas de 4 m: la lima publicada (37,8 m) es 2 × (4 + 10,3 + 1,6)
  + 6 m y el burlón (46,6 m) 2 × (4 + 13,3 + 3) + 6 m. El motor toma esos totales (como ITO 043 e IAT
  75); los tramos verticales (bridas de 4 m) no van sobre el paño y los tramos sobre el ala son más largos
  que su borde estirado (53 filas AB de 120 mm = 6,36 m): A VERIFICAR.'
- 'Aparejo y condiciones de la simulación (p. 2): 5 flotadores de 200 mm; 140 kg de cadena; bridas de
  cable combinado de 4 m por banda (superior Ø18 mm, inferior Ø22 mm); portones planos de hierro y madera
  de 4,20 × 1,30 m y 450 kg; tijera de 55 m de Ø26 mm; 350 m de cable de Ø22 mm; relinga superior Ø18
  mm e inferior Ø22 mm de cable combinado; 4 nudos; 100 m; fango.'
- 'Hilos: el informe sólo da «Ny Tr 4 mm» en el copo; el resto de los hilos son supuestos (A VERIFICAR).'
