id: scharfe_krill_1420x200
name: Arrastre pelágico de krill de 4 paneles, 1420 × 200 mm (Schärfe 1983)
description: Red pelágica de 4 paños iguales con 1420 mallas de 200 mm de circunferencia (284 m), cuerpo
  de 170–22 mm y copo de 9 mm. Red de krill modificada que el B/I Dr. Fridtjof Nansen usó para peces linterna
  en el golfo de Omán (1983).
source: 'Schärfe 1983 (FI:DP/GLO/82/001), apéndice 5: Krill trawl, 1420 × 200 = 284 m circumference (https://www.fao.org/4/x6567e/x6567e00.htm)'
family: pelagic
rig: otter
