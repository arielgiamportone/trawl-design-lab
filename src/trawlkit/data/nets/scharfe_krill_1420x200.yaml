rigging:
  doors: SÜBERKRÜB cambados de 4,3 × 1,9 m (8,2 m²), 1,35 t
  bridles: 100 m (las inferiores 94 m más 6 m de cadena de peso delantero)
  front_weights: cadena de 230 a 520 kg por lado según el lance
design:
  depth_m: 125.0
  sweeps_m: 80.0
  door_length_m: 4.3
  door_height_m: 1.9
  door_weight_air_kg: 1350.0
  vessel_length_m: 45.0
notes:
- Los costados del plano tienen alas como el dorso y el vientre; en el modelo los costados empiezan en
  la primera estación del cuerpo (las relingas van por las alas del dorso y del vientre).
- 'Cuatro paños iguales: 4 × 355 = 1420 mallas de 200 mm, la circunferencia que da el título del apéndice.'
- 'Las franjas de 170 y 120 mm se angostan respecto de la de 200 mm (empalmes de 16 y 18 %): es el plano,
  no un error de lectura.'
- El documento estima la boca en 256 m² (16 × 16 m).
