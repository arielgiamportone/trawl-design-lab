# Biblioteca de polares de portones (Fase 19.3): coeficientes CL/CD medidos, con su fuente.
#
# * sfia1993: las 26 hojas de datos del Apéndice IV de Seafish/IFREMER/DIFTA (1993), ensayos de
#   modelos en tanque de flujo. Transcriptas de la imagen de cada página del PDF escaneado y
#   verificadas una por una (2026-10-27). «null» = el ángulo no se ensayó («-» en la hoja).
# * mellibovsky2018: Tablas 2 y 3 (Thyborøn 15 VF y Grilli Fly), tanque de flujo (FT) y túnel de
#   viento (WT) a los mismos ángulos; capa de texto del manuscrito aceptado, comprobada.
#
# Las polares representativas por tipo (media de varias hojas o ajuste) no se guardan aquí: las
# calcula trawlkit.rigging.polars.polar_for_type con la regla escrita en TYPE_POLARS.
conditions:
  sfia1993_flume:
    document: sfia1993
    facility: tanques de flujo de Hull (Seafish), Boulogne (IFREMER) y Hirtshals (DIFTA)
    speed_ms: 0.9
    reynolds: 5.0e5
    page: 'Sección 3-2 y 3-3 (págs. del PDF 47-48); Apéndice III-9 y III-11 (págs. 123 y 125)'
    note: >-
      Modelos a escala sobre la cinta del tanque, que corre a la velocidad del agua, 0,9 m/s aprox.
      (sección 3-2): el CD incluye el rozamiento con la cinta (App. III-9). Ángulos de 25 a 45° con
      escora constante, cable a 6° de la vertical. CL y CD sobre la superficie proyectada A (ejemplo
      del App. III-11). Reynolds ≈ 5e5 (derivado:
      V·L/ν con L ≈ 0,7 m). Los métodos de cálculo dan un ángulo unos 4° mayor que el que el portón
      toma en el mar (App. III-11). Escala: CL varió hasta 6 % y CD hasta 14 % entre dos tamaños
      del mismo diseño (sección 3-15).
  mellibovsky2018_ft:
    document: mellibovsky2018
    facility: tanque de flujo del Marine Institute, St John's (Terranova), 8 × 4 × 22,25 m
    reynolds: 2.3e5
    page: 'pág. 5 del manuscrito aceptado'
    note: >-
      Ensayo del 10 de septiembre de 2014; V nominal 0,95 m/s (Thyborøn) y 0,7 m/s (Grilli), Re ≈ 2,3e5
      con la cuerda. Portones aparejados con cable adelante y dos líneas de brida atrás. Los
      coeficientes del tanque quedan 20-30 % (Thyborøn) y 15-20 % (Grilli, α bajo) por debajo del túnel
      de viento; los autores lo atribuyen sobre todo a un error de la velocidad nominal del tanque
      (≈ 11 % y 8 %), así que el valor real puede estar entre ambos.
  mellibovsky2018_wt:
    document: mellibovsky2018
    facility: túnel de viento MariKom (Rostock), sección abierta de 1,4 m
    page: 'págs. 4-5 y Tablas 2-3 del manuscrito aceptado'
    note: >-
      Predicción del túnel de viento (Mellibovsky et al. 2015) interpolada a los mismos ángulos α y β
      medidos en el tanque. Sin fondo ni rozamiento.
