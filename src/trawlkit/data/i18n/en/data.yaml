# Nombres y notas de los catálogos de datos (fondos, ensuciamiento, especies) en inglés.
# La API y el motor los traducen al serializar (``to_dict``) cuando el idioma es inglés.
"Fango": "Mud"
"Sedimento blando; el tren y las zapatas se hunden y movilizan más sedimento.": "Soft sediment; the ground gear and the shoes sink in and move more sediment."
"alta": "high"
"Arena": "Sand"
"Fondo firme; rozamiento intermedio.": "Firm seabed; intermediate friction."
"media": "medium"
"Intermedio (mixto)": "Intermediate (mixed)"
"Valor por defecto del simulador (μ = 0,5).": "Simulator default (μ = 0.5)."
"Grava y conchilla": "Gravel and shell"
"Abrasivo; más arrastre del tren de fondo.": "Abrasive; more drag on the ground gear."
"baja": "low"
"Roca o piedra": "Rock or stone"
"Con tren de rodillos (rockhopper) el rozamiento efectivo baja; riesgo de enganche.": "With a rockhopper ground gear the effective friction is lower; risk of snagging."
"Red limpia": "Clean net"
"Sin ensuciamiento (valor por defecto).": "No fouling (default)."
"Algas en las alas": "Algae on the wings"
"Algas desprendidas que se enganchan en las alas y la boca al arrastrar cerca de bosques de macroalgas.": "Loose algae caught on the wings and the mouth when towing near kelp forests."
"Medusas en el copo": "Jellyfish in the codend"
"Colmatación del copo y el cuerpo por medusas (floraciones estacionales).": "Codend and body clogged by jellyfish (seasonal blooms)."
"Ensuciamiento general": "General fouling"
"Red con mantenimiento deficiente o con organismos adheridos en todo el paño.": "Poorly maintained net or organisms attached across the whole netting."
"Merluza común": "Argentine hake"
"Pesquería de arrastre del Atlántico Sudoccidental; cuerpo alargado y fusiforme.": "Southwest Atlantic trawl fishery; elongated, fusiform body."
"Merluza europea": "European hake"
"Atlántico Nororiental y Mediterráneo.": "Northeast Atlantic and Mediterranean."
"Bacalao": "Cod"
"Especie de referencia de FISHSELECT (secciones medidas en el Báltico y el mar de Barents).": "FISHSELECT reference species (sections measured in the Baltic and the Barents Sea)."
"Eglefino": "Haddock"
"Cuerpo más alto y comprimido que el bacalao.": "Deeper and more compressed body than cod."
"Cigala": "Norway lobster"
"Sección del caparazón (rígido); la talla es el largo del caparazón. Las pinzas pueden enredarse en el paño y no se modelan.": "Section of the (rigid) carapace; the length is the carapace length. The claws can get entangled in the netting and are not modelled."
"Langostino": "Argentine red shrimp"
"Sección del cefalotórax; pesquería patagónica con copos de 45–55 mm.": "Section of the cephalothorax; Patagonian fishery with 45–55 mm codends."
"Platija": "Plaice"
"Pez plano; la sección es muy aplanada, por lo que pasa de canto por mallas abiertas.": "Flatfish; the section is very flat, so it passes edgeways through open meshes."
"Lenguado": "Sole"
"Pez plano, más angosto que la platija.": "Flatfish, narrower than plaice."
