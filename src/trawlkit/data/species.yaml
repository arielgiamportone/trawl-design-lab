# Forma de la sección transversal de máxima resistencia de cada especie (trawlkit.selectivity).
#
# Modelo geométrico tipo FISHSELECT (Herrmann et al. 2009): un pez de talla L pasa por una malla
# si su sección transversal más resistente (una elipse de alto h y ancho w) entra en la luz de la
# malla, con el pez libre de girar. Aquí la sección se escala con la talla: h = height·L y
# w = width·L, con un factor de compresión de los tejidos (compression ≤ 1) y una variabilidad
# morfológica entre individuos de la misma talla (cv, desvío relativo de h y w).
#
# length: medida de talla (TL largo total, CL largo del caparazón) y unidad (cm o mm).
# A VERIFICAR: los coeficientes son estimaciones de orden de magnitud a partir de la morfología
# publicada (FISHSELECT para bacalao, eglefino y cigala; morfometría general para el resto). Para
# un uso cuantitativo deben reemplazarse por mediciones de la especie en la pesquería.
source: estimación a partir de Herrmann et al. 2009, Krag et al. 2008 y Frandsen et al. 2010 (A VERIFICAR)
