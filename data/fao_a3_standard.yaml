notes:
- 'Convención de `count`: en alas y puntas de ala (A, B, C, D, F) `count: 2` significa panel izquierdo
  + derecho del mismo plano (fila del dibujo: la letra aparece dos veces, p. ej. N62 = SUM(COUNTIF(37:37,"A"),COUNTIF(37:37,"B"))
  = 4).'
- 'En G, H e I'' el Excel etiqueta con la misma letra el panel del plan alto (dorso D) y el del plan bajo
  (vientre V), con composturas idénticas (verificado: bloques H156:K158 = T156:W158, etc.). Se expresan
  como un panel con `count: 2` y `planes_covered: [upper, lower]`; `plane` indica el bloque de referencia
  (superior).'
- '`meshes_top` es el borde del panel más cercano a la boca de la red (donde empieza el paño) y `meshes_bottom`
  el borde hacia la bolsa, según los planos 2D (A/B 3→57, C 57→117, D 57→97, E 412→372, F 129→143, G 372→162,
  H 243→113, I/J 113→113, I'' 139→139). La hoja no usa esa convención: ''a (T1)'' es el borde mayor y
  ''b (T2)'' el menor; se conservan como `meshes_a` y `meshes_b` con sus celdas de origen.'
- '`hanging_ratio` es el U1 (coeficiente de abertura horizontal) de la tabla resumen N269:W291 (0.38 para
  mallero 80/60 mm, 0.23 para 40/30 mm), que alimenta ''Mecánica de la Red''!K56:K60. `plan_coef_x`/`plan_coef_y`
  (0.5 / 1) son los coeficientes X/Y ''en el plano'' con los que la hoja convierte mallas a metros (columnas
  D/F y P/R).'
- '`cut_code` es el corte X1 (VLOOKUP sobre ''Tablas de Referencias''!A49:C88) y `cut_code_x2` el X2.
  En el panel F el X1 (T122) devuelve #N/A en el libro y se omite.'
- 'Runnage: el libro calcula 1e6/Rtex (781.25 y 1052.63 m/kg); los planos redondean a 781 y 1053 m/kg.
  Material PA (nylon, ''NY'' en los planos).'
- 'Flotación: 12 boyas de Ø200 mm para 36 kgf (promedio Fridman a 150 HP, ''Flotación y Lastre''!F70→F90).
  Para 180 HP el libro calcula 39.9 kgf (G70) → 13 boyas (G82). El plano impreso indica ''Flotación total=33Kg''
  con 12 boyas.'
- 'Lastre: `ballast_kg` = ''Flotación y Lastre''!F226 (''Lastre máximo para 150 HP'', 42 kg, coincide
  con ''Lastre total=42Kg'' de los planos); el mínimo (F225) es `ballast_min_kg`. Distribución (F243:I245):
  reglaje 12 kg (cadena 2 m), bocana 8 kg, alas 22 kg.'
source_cells:
  ballast_kg: Flotación y Lastre!F226
  ballast_min_kg: Flotación y Lastre!F225
