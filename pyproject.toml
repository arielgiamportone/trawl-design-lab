[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trawlkit"
dynamic = ["version"]
description = "Motor de cálculo para el diseño y dimensionamiento de redes de arrastre (trawl net design engine)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ariel Luján Giamportone", email = "giamportone1@gmail.com" }]
keywords = ["fisheries", "trawl", "fishing-gear", "naval-engineering", "FAO"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pint>=0.24",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
docs = [
  "jupyter-book>=1.0,<2",
  "sphinxcontrib-bibtex>=2.6",
  "matplotlib>=3.9",
  "jupytext>=1.16",
  "ipykernel>=6.29",
  "nbconvert>=7.16",
  "plotly>=5.22",
]
optimize = ["scipy>=1.13"]
excel = ["openpyxl>=3.1"]
report = ["weasyprint>=62", "openpyxl>=3.1"]
all = ["trawlkit[api,docs,optimize,excel,report]"]

[project.scripts]
trawlkit = "trawlkit.cli:app"

[project.urls]
Homepage = "https://github.com/arielgiamportone/trawl-design-lab"
Documentation = "https://arielgiamportone.github.io/trawl-design-lab/"
Application = "https://arielgiamportone.github.io/trawl-design-lab/app/"
Changelog = "https://github.com/arielgiamportone/trawl-design-lab/blob/main/CHANGELOG.md"
Issues = "https://github.com/arielgiamportone/trawl-design-lab/issues"
Origin = "https://github.com/arielgiamportone/Trawl_net_model_in_Advanced_Excel"

[dependency-groups]
dev = [
  "ruff>=0.5",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[tool.hatch.version]
# Fuente única de la versión: trawlkit.__version__ (la API y los informes la muestran).
path = "src/trawlkit/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src/trawlkit", "/tests", "/README.md", "/LICENSE", "/LICENSE-docs", "/CHANGELOG.md", "/CITATION.cff"]

[tool.hatch.build.targets.wheel]
# Incluye todo lo que hay bajo src/trawlkit, también los datos (data/*.yaml, data/reference/*.csv);
# tests/test_packaging.py lo verifica instalando la rueda.
packages = ["src/trawlkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools", "api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tools/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/trawlkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests lentos (empaquetado; activar con TRAWLKIT_PACKAGING_TEST=1)",
]
