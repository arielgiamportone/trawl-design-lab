name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Librerías de sistema para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=trawlkit
      - name: Rueda instalable (datos empaquetados, CLI fuera del checkout)
        run: uv run pytest tests/test_packaging.py
        env:
          TRAWLKIT_PACKAGING_TEST: '1'
      - name: Informe del caso FAO A-3
        run: |
          uv run trawlkit report fao_a3_standard --modified fao_a3_modified \
            --vessel fao_a3_150hp --out informe-corregido
          uv run trawlkit report fao_a3_standard --modified fao_a3_modified \
            --vessel fao_a3_150hp --compat excel --out informe-excel
      - uses: actions/upload-artifact@v4
        with:
          name: informe-fao-a3
          path: |
            informe-corregido/
            informe-excel/
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos de la API al día con openapi.json
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - uses: astral-sh/setup-uv@v5
      - name: Librerías de sistema para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Dependencias de la API
        working-directory: .
        run: uv sync --all-extras --dev
      # Motor sin conexión: la wheel de trawlkit va con la app (web/public/py/) y se prueba
      # dentro de Pyodide en Node contra las respuestas de CPython (tolerancia 1e-9).
      - name: Motor sin conexión (wheel para Pyodide)
        working-directory: .
        run: |
          uv build --wheel -o dist-wheel
          uv run python tools/offline_bundle.py dist-wheel/trawlkit-*.whl web/public/py
      - name: Paridad del motor en Pyodide
        run: |
          uv run python ../tools/offline_expected.py "$RUNNER_TEMP/offline_expected.json"
          node scripts/pyodide-parity.mjs public/py/manifest.json "$RUNNER_TEMP/offline_expected.json"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
      # E2E contra `vite preview` + API real (Playwright levanta ambos servidores).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
  # Imagen de la API para Render (Dockerfile + render.yaml): construye, arranca y prueba.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t trawlkit-api .
      - name: Arrancar el contenedor (PORT como en Render)
        run: |
          docker run -d --name trawlkit-api -p 8000:10000 -e PORT=10000 \
            -e TRAWLKIT_CORS_ORIGINS=https://arielgiamportone.github.io \
            -e TRAWLKIT_MAX_SIM_SECONDS=20 -e TRAWLKIT_MAX_OPT_GRID=15 trawlkit-api
      - name: Esperar /health
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs trawlkit-api
          exit 1
      - name: POST /design con el caso por defecto
        run: |
          code=$(curl -sS -o design.json -w '%{http_code}' -X POST http://127.0.0.1:8000/design \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"
          test "$code" = 200
          grep -q '"headrope_m"' design.json
      - name: Informe PDF (WeasyPrint + Pango en la imagen)
        run: |
          code=$(curl -sS -o informe.pdf -w '%{http_code}' -X POST \
            'http://127.0.0.1:8000/design/report?format=pdf' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"
          test "$code" = 200
          head -c 5 informe.pdf | grep -q '%PDF-'
      - name: CORS para GitHub Pages
        run: |
          curl -sSi -X OPTIONS http://127.0.0.1:8000/design \
            -H 'Origin: https://arielgiamportone.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            | grep -i '^access-control-allow-origin: https://arielgiamportone.github.io'
      - name: Healthcheck de Docker
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect --format '{{.State.Health.Status}}' trawlkit-api)
            echo "$s"; [ "$s" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Logs del contenedor
        if: always()
        run: docker logs trawlkit-api || true
      - name: Detener el contenedor
        if: always()
        run: docker rm -f trawlkit-api || true
