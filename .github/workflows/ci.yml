name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Librerías de sistema para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=trawlkit
      - name: Informe del caso FAO A-3
        run: |
          uv run trawlkit report data/fao_a3_standard.yaml --modified data/fao_a3_modified.yaml \
            --vessel fao_a3_150hp --out informe-corregido
          uv run trawlkit report data/fao_a3_standard.yaml --modified data/fao_a3_modified.yaml \
            --vessel fao_a3_150hp --compat excel --out informe-excel
      - uses: actions/upload-artifact@v4
        with:
          name: informe-fao-a3
          path: |
            informe-corregido/
            informe-excel/
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tipos de la API al día con openapi.json
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
      # E2E contra `vite preview` + API real (Playwright levanta ambos servidores).
      - uses: astral-sh/setup-uv@v5
      - name: Librerías de sistema para WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Dependencias de la API
        working-directory: .
        run: uv sync --all-extras --dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
